name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: OpenAPI spec is up to date
        run: uv run python scripts/export_openapi.py --check

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway CI-only database; not a real credential.
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: spendwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendwise -d spendwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://spendwise:ci-only-password@localhost:5432/spendwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Test on PostgreSQL
        run: uv run pytest

  frontend:
    name: Frontend (lint + types + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: API types are up to date with openapi.json
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts
      - name: Unit tests
        run: npm test
      - name: Build (includes typecheck)
        run: npm run build
