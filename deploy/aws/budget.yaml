AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SpendWise cost alerts: a monthly AWS Budget that emails before spending reaches the limit.
  Deploy this before spendwise-stack.yaml. Budgets with email alerts are free.

# A budget alerts; it does not stop or cap anything. AWS updates billing data a few times a day,
# so an alert can arrive hours after the spending that caused it.

Parameters:
  AlertEmail:
    Type: String
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    Description: Address that receives the budget alerts (no confirmation email is needed).
  MonthlyLimitUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly limit in USD. SpendWise on the free tier should stay well below it.

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
        # Usage before credits: an account paying with free credits still hears about spending
        # that eats into them, not only once they run out.
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  BudgetName:
    Value: !Ref MonthlyCostBudget
