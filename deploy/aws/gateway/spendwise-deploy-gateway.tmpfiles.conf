# Installed as /etc/tmpfiles.d/spendwise-deploy-gateway.conf by install-gateway.sh. The directory
# of the gateway's Unix socket, created at every boot before Docker starts, so the bind mount in
# deploy/aws/compose.aws.yaml always gives Caddy this directory. Only its owner and root (Caddy
# runs as root in its container) can reach the socket.
d /run/spendwise-deploy-gateway 0750 spendwise-deploy-gateway spendwise-deploy-gateway -
