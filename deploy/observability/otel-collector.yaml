# OpenTelemetry Collector for SpendWise (docs/observability.md). The API sends traces, metrics and
# logs here over OTLP/HTTP; the Collector limits its memory, batches them and exports them.
#
# For now the only exporter is `debug`, which prints everything it receives to the Collector's
# own log (`docker compose ... logs otel-collector`), so local runs and CI can check all three
# signals arrive. A real backend later means another exporter in `exporters` and in each pipeline
# (e.g. otlp_http to Grafana Cloud, with its credentials from the environment), not an app change.

receivers:
  otlp:
    protocols:
      http:
        # Inside the container. It is reachable only on the Compose "telemetry" network, which is
        # internal: no port is published, and nothing outside Docker can send to it.
        endpoint: 0.0.0.0:4318
        # Small, like SpendWise's batches: a much larger request is not from SpendWise.
        max_request_body_size: 4194304 # 4 MiB

processors:
  # First in every pipeline: refuses data before the Collector runs out of memory (the container
  # has 256 MiB, compose.observability.yaml), so the SDKs retry instead of the Collector dying.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 1s

exporters:
  # Everything, attributes included, so the checks can see the resource of each signal and
  # that nothing sensitive is in it. A shared or deployed Collector would use "basic".
  debug:
    verbosity: detailed

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        # The Collector's own counters (accepted, refused and exported spans, data points and
        # log records), for the checks. On the internal network only.
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
