# Render Blueprint for SpendWise (README, "Deploy to Render").
#
# Render does not run Docker Compose. This Blueprint describes the same production shape with
# Render's own resources: one Docker web service built from the existing root Dockerfile (React
# build + FastAPI) and one managed Render PostgreSQL database. compose.yaml and
# compose.override.yaml stay the definition for local use and for the integration and
# end-to-end tests.
#
# Free plans only: no paid instance types, disks, extra instances, autoscaling or backups.
# Free limits (README): the web service sleeps after 15 minutes without traffic, and the free
# database expires 30 days after creation and is deleted 14 days later unless upgraded.
#
# No secrets in this file: the database password is generated by Render and reaches the app
# only through DATABASE_URL.

services:
  - type: web
    name: spendwise
    runtime: docker
    plan: free
    # Must match the database's region so the app uses the private (internal) connection.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    # Deploy each new commit on main once its GitHub checks (the CI workflow) have passed.
    autoDeployTrigger: checksPass
    # 200 only when the database answers; Render routes traffic to a new deploy once it passes.
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: fake
      - key: SESSION_TTL_DAYS
        value: "14"
      # The database's internal connection string (postgresql://USER:PASSWORD@HOST/DB); the
      # app selects the psycopg driver itself.
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      # On the first Blueprint sync the database may still be provisioning while the app
      # starts; wait up to 5 minutes for it instead of the default 60 seconds.
      - key: DB_WAIT_TIMEOUT
        value: "300"
      # PORT is not set here: Render provides it (10000 by default) and the app listens on it.
      # SESSION_COOKIE_SECURE is not set: production cookies are Secure, and every request that
      # reached Render over HTTPS gets a Secure cookie.

databases:
  - name: spendwise-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: spendwise
    user: spendwise
    # No external connections: only Render services in the same region (the app) can connect,
    # through the internal URL.
    ipAllowList: []
