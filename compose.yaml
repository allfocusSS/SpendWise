# SpendWise: PostgreSQL 18 + the production app image (UI and API in one container).
#
# This file is the deployment definition: it is what gets imported into Railway (README,
# "Deploy to Railway"). It holds no secrets and no local-only settings, so the database
# password must come from the environment.
#
# Locally, `docker compose` also merges compose.override.yaml automatically, which adds the
# development defaults (a fixed database password, plain-HTTP cookies, port 8000 on 127.0.0.1):
#
#   docker compose up --build    # build and start; open http://localhost:8000
#   docker compose down          # stop and remove the containers; the database volume is kept
#   docker compose down -v       # stop and DELETE the local database (the "pgdata" volume)
#
# Settings are read from the shell or from a .env file next to this file (.env.example,
# "Docker Compose").

name: spendwise

services:
  db:
    image: postgres:18
    environment:
      # Applied only when the volume is first created. The same values build DATABASE_URL below,
      # so the password must be URL-safe (letters, digits, - _ .).
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      # No default here: PostgreSQL refuses to initialise without a password, so a deployment
      # that forgot to set one fails instead of running with a known password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # PostgreSQL 18 keeps its data in /var/lib/postgresql/18/docker, a subdirectory of the
      # volume, so a platform volume's lost+found at the mount root does not get in the way.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Never published: only the app reaches the database, over the private network.

  app:
    build: .
    depends_on:
      db:
        # Compose starts the app after pg_isready passes. Platforms without ordering are covered
        # by the app itself, which waits for the database before migrating (start.sh).
        condition: service_healthy
        restart: true
    environment:
      ENVIRONMENT: production
      # "db" is the database's hostname on the Compose network. Platforms with other private
      # hostnames set DATABASE_URL themselves (README, "Deploy to Railway").
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spendwise}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-spendwise}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      # No SESSION_COOKIE_SECURE: production cookies are Secure, and every HTTPS request gets a
      # Secure cookie regardless. The app listens on $PORT if the platform provides it, else 8000.
    # The image's HEALTHCHECK (GET /api/health/ready) applies; it is not redefined here.
    restart: unless-stopped

volumes:
  pgdata:
