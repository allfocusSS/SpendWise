name: CI

# The complete test suite for every pull request to main and every push to main:
# backend (SQLite and PostgreSQL), frontend, the Docker Compose integration suite and the
# Playwright end-to-end suite. No secrets are used or needed.
#
# After every job passed on a push to main, that exact commit is deployed to the AWS instance
# (deploy/aws/README.md, "Automatic deploys"). The repository variable AWS_DEPLOY_MODE picks how:
#   self-hosted-runner  deploy-aws runs on the instance's own runner (AWS Free Tier Projects,
#                       whose SCP denies iam:*Provider*, so no OIDC provider can exist)
#   oidc-ssm            deploy-aws-oidc uses GitHub OIDC credentials and SSM Run Command
# Unset, nothing is deployed. Pull requests never deploy, and every other job runs on
# GitHub-hosted runners.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token. Uploading artifacts and using the cache do not need extra permissions.
# deploy-aws gets no token at all; deploy-aws-oidc alone also gets id-token: write.
permissions:
  contents: read

# A new commit on a pull request cancels that pull request's older run. Runs on main are keyed
# by commit, so they never cancel each other and every main commit gets a full result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: OpenAPI spec is up to date
        run: uv run python scripts/export_openapi.py --check

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway CI-only database; not a real credential.
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: spendwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendwise -d spendwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://spendwise:ci-only-password@localhost:5432/spendwise_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Test on PostgreSQL
        run: uv run pytest

  frontend:
    name: Frontend (lint + types + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: API types are up to date with openapi.json
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts
      - name: Typecheck (app and end-to-end tests)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Integration (Docker Compose + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The tests write the run's container logs here (including containers replaced by the
      # restart test); uploaded when the job fails.
      SPENDWISE_IT_LOG_FILE: ${{ github.workspace }}/integration-compose-logs.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true
      - name: Docker and Compose versions
        run: |
          docker --version
          docker compose version
      - name: Integration tests (builds the image, real Compose stack with PostgreSQL)
        run: make integration
      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-compose-logs
          path: integration-compose-logs.txt
          retention-days: 14
          if-no-files-found: ignore
      # The tests remove the stack themselves; this covers interrupted or cancelled runs.
      - name: Remove the test stack and its volume
        if: always()
        working-directory: backend
        run: uv run python -m integration.stack down

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # Only Chromium and the system libraries it needs. Not cached: Playwright recommends a
      # fresh install, and restoring the cache takes about as long as downloading it.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds the image, real Compose stack with PostgreSQL)
        run: make e2e
      # Failure artifacts only: the HTML report plus, per failed test, a trace, screenshot,
      # browser log and page snapshot, and the run's container logs (compose-logs.txt).
      - name: Upload Playwright report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
      # Playwright's teardown normally removes the stack; this covers interrupted runs.
      - name: Remove the test stack and its volume
        if: always()
        working-directory: backend
        env:
          SPENDWISE_IT_PROJECT: spendwise-e2e
          SPENDWISE_IT_PORT: "18100"
          SPENDWISE_IT_IMAGE: spendwise:e2e
        run: uv run python -m integration.stack down

  # One stable check for branch protection: it fails unless every job above succeeded.
  all-checks:
    name: All checks passed
    if: always()
    needs: [backend, backend-postgres, frontend, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Job results
        run: |
          echo "backend:          ${{ needs.backend.result }}"
          echo "backend-postgres: ${{ needs.backend-postgres.result }}"
          echo "frontend:         ${{ needs.frontend.result }}"
          echo "integration:      ${{ needs.integration.result }}"
          echo "e2e:              ${{ needs.e2e.result }}"
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # Mode B (AWS Free Tier Project): deploy on the instance's own self-hosted runner. Only for a
  # push to main of this repository, only after "All checks passed" succeeded. The runner's
  # job-started hook refuses every other job, and its user may run exactly one root command:
  # the deploy wrapper, for the current head of main (deploy/aws/runner/).
  deploy-aws:
    name: Deploy to AWS (self-hosted runner)
    needs: [all-checks]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'allfocusSS/SpendWise' && vars.AWS_DEPLOY_MODE == 'self-hosted-runner'
    runs-on: [self-hosted, linux, spendwise-deploy]
    timeout-minutes: 60
    # No GITHUB_TOKEN on the production host: no step needs one, and nothing is checked out.
    permissions: {}
    concurrency:
      group: deploy-aws-production
      cancel-in-progress: false
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      # The commit this run tested, never "main": a later push cannot slip into this deploy.
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check the deployment settings
        run: |
          if ! [[ $PRODUCTION_URL =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Repository variable PRODUCTION_URL is missing or invalid (deploy/aws/README.md)"
            exit 1
          fi
          if ! [[ $COMMIT_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit SHA: $COMMIT_SHA"
            exit 1
          fi

      # An older commit can finish CI after a newer one; the newer run deploys instead. (The
      # wrapper refuses anything but the head of main as well.)
      - name: Skip if main has moved on
        id: latest
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          if [ "$head" = "$COMMIT_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; that run deploys instead of $COMMIT_SHA."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs locally on the instance: fetch, build, `docker compose up --wait`; fails unless the
      # stack becomes healthy. The step timeout bounds it.
      - name: Deploy the commit
        if: steps.latest.outputs.deploy == 'true'
        timeout-minutes: 50
        run: |
          set -o pipefail
          sudo -n /usr/local/sbin/spendwise-deploy-sha "$COMMIT_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          if ! grep -q "^Deploying $COMMIT_SHA " "$RUNNER_TEMP/deploy.log"; then
            echo "::error::spendwise-deploy did not report deploying $COMMIT_SHA"
            exit 1
          fi

      - name: Verify production health
        if: steps.latest.outputs.deploy == 'true'
        run: |
          # Bounded retries: Caddy may still be starting after the containers were replaced.
          for path in /api/health /api/health/ready; do
            echo "GET $PRODUCTION_URL$path"
            curl -fsS --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors \
              "$PRODUCTION_URL$path"
            echo
          done
          echo "GET $PRODUCTION_URL/"
          curl -fsS --max-time 10 --retry 3 --retry-delay 5 --retry-all-errors \
            "$PRODUCTION_URL/" | grep -q '<div id="root">'
          echo "Deployed $COMMIT_SHA to $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"

  # Mode A (standard AWS accounts): GitHub OIDC credentials and SSM Run Command, no runner on
  # the instance. Needs the OIDC resources (GitHubDeployMode=oidc-ssm in the stack), which an AWS
  # Free Tier Project's SCP forbids. Same conditions as deploy-aws otherwise.
  deploy-aws-oidc:
    name: Deploy to AWS (OIDC + SSM)
    needs: [all-checks]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'allfocusSS/SpendWise' && vars.AWS_DEPLOY_MODE == 'oidc-ssm'
    runs-on: ubuntu-latest
    # The deploy builds the image on a micro instance (up to 50 minutes, the document's limit).
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write # the OIDC token that AWS exchanges for temporary credentials
    # One deploy at a time and never cancelled half-way; a newer commit waits for it.
    concurrency:
      group: deploy-aws-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.AWS_DEPLOY_DOCUMENT }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      # The commit this run tested, never "main": a later push cannot slip into this deploy.
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check the deployment settings
        run: |
          ok=true
          check() { # name value pattern
            if ! [[ $2 =~ $3 ]]; then echo "::error::$1 is missing or invalid (deploy/aws/README.md)"; ok=false; fi
          }
          check "Repository variable AWS_REGION" "$AWS_REGION" '^[a-z]{2}(-[a-z]+)+-[0-9]$'
          check "Repository variable AWS_INSTANCE_ID" "$INSTANCE_ID" '^i-[0-9a-f]{8,17}$'
          check "Repository variable AWS_DEPLOY_DOCUMENT" "$DEPLOY_DOCUMENT" '^[A-Za-z0-9_.-]{3,128}$'
          check "Repository variable PRODUCTION_URL" "$PRODUCTION_URL" '^https://[A-Za-z0-9.-]+$'
          check "The commit SHA" "$COMMIT_SHA" '^[0-9a-f]{40}$'
          $ok

      # Runs on main are not cancelled by newer ones, so an older commit can finish CI after a
      # newer one. Deploying it would roll production back; the newer run deploys instead.
      - name: Skip if main has moved on
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$COMMIT_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; that run deploys instead of $COMMIT_SHA."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get temporary AWS credentials (OIDC)
        if: steps.latest.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: spendwise-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      # The SSM document runs `spendwise-deploy <commit SHA>` as root on the instance: fetch,
      # build, `docker compose up --wait`. It fails unless the stack becomes healthy.
      - name: Deploy the commit through SSM Run Command
        if: steps.latest.outputs.deploy == 'true'
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DEPLOY_DOCUMENT" \
            --parameters "CommitSha=$COMMIT_SHA" \
            --comment "GitHub Actions run $GITHUB_RUN_ID, ${COMMIT_SHA:0:12}" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"

          # Bounded polling: a little longer than the document's own 3000-second limit.
          deadline=$((SECONDS + 3200))
          while :; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No result from SSM command $command_id in time"
              exit 1
            fi
            sleep 15
            if ! invocation=$(aws ssm get-command-invocation --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" --output json 2>&1); then
              # Right after SendCommand the invocation may not exist yet.
              if grep -q InvocationDoesNotExist <<< "$invocation"; then continue; fi
              echo "$invocation"
              exit 1
            fi
            status=$(jq -r .Status <<< "$invocation")
            case "$status" in
              Pending | InProgress | Delayed) echo "$status (${SECONDS}s)" ;;
              *) break ;;
            esac
          done

          echo "::group::Output of spendwise-deploy on the instance"
          jq -r .StandardOutputContent <<< "$invocation"
          jq -r .StandardErrorContent <<< "$invocation"
          echo "::endgroup::"
          if [ "$status" != Success ]; then
            echo "::error::Deploy failed on the instance: $status (SSM command $command_id)"
            exit 1
          fi
          if ! jq -r .StandardOutputContent <<< "$invocation" | grep -q "^Deploying $COMMIT_SHA "; then
            echo "::error::The instance did not report deploying $COMMIT_SHA"
            exit 1
          fi

      - name: Verify production health
        if: steps.latest.outputs.deploy == 'true'
        run: |
          # Bounded retries: Caddy may still be starting after the containers were replaced.
          for path in /api/health /api/health/ready; do
            echo "GET $PRODUCTION_URL$path"
            curl -fsS --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors \
              "$PRODUCTION_URL$path"
            echo
          done
          curl -fsS --max-time 10 "$PRODUCTION_URL/" | grep -q '<div id="root">'
          echo "Deployed $COMMIT_SHA to $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
